name: Build mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      auto_submit:
        description: Submit a production build to the stores
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.0.2
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build without store submission
        if: ${{ !inputs.auto_submit }}
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait

      - name: Build and submit to stores
        if: ${{ inputs.auto_submit && inputs.profile == 'production' }}
        run: eas build --platform "${{ inputs.platform }}" --profile production --auto-submit --non-interactive --no-wait

      - name: Reject unsupported submission profile
        if: ${{ inputs.auto_submit && inputs.profile != 'production' }}
        run: |
          echo "Store submission is only available for the production profile."
          exit 1
